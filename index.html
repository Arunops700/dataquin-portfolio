<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataQuin — Data · Automation · AI Engineering</title>
  <!-- This description must equal PAGE_META.home in src/seo.js: the
       build runs scripts/route-heads.mjs, which fails if it drifts. -->

  <meta name="theme-color" content="#191209" />

  <!-- Link previews. Scrapers (LinkedIn, WhatsApp, Slack) don't run JS, so
       these static tags describe the site as a whole; src/seo.js refines
       them per route for browsers and JS-rendering crawlers.
       The host below is also written in src/seo.js, robots.txt and
       sitemap.xml — see the SITE_URL comment in src/seo.js before deploying. -->
  <link rel="canonical" href="https://dataquin.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="DataQuin" />
  <meta property="og:title" content="DataQuin — Data · Automation · AI Engineering" />
  <meta property="og:description" content="We turn manual days into automated hours. Selected case studies: real problems solved with AI and automation." />
  <meta property="og:url" content="https://dataquin.vercel.app/" />
  <meta property="og:image" content="https://dataquin.vercel.app/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="DataQuin — We turn manual days into automated hours." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DataQuin — Data · Automation · AI Engineering" />
  <meta name="twitter:description" content="We turn manual days into automated hours. Selected case studies: real problems solved with AI and automation." />
  <meta name="twitter:image" content="https://dataquin.vercel.app/og.png" />
  <!-- Keep the email and phone here and in the noscript copy in step
       with CONTACT in src/data/site.js — the build checks them
       (scripts/route-heads.mjs) and fails if they drift. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "DataQuin",
    "url": "https://dataquin.vercel.app/",
    "logo": "https://dataquin.vercel.app/og.png",
    "image": "https://dataquin.vercel.app/og.png",
    "description": "Data, automation and AI engineering for professional services firms: dashboards and reporting, system-to-system integration and AI pipelines.",
    "email": "kavita@dataquin.com",
    "telephone": "+1-908-672-0809",
    "slogan": "Driven by Purpose, Powered by Precision",
    "areaServed": "US",
    "knowsAbout": ["Business analytics", "Data science", "AI solutions", "Automation", "Data migration"]
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Three voices: Fraunces display (roman + true italics — the italic is
       the "spoken emphasis" cut for gold phrases), Plus Jakarta Sans body,
       IBM Plex Mono for ledger labels, serials and figures. -->
  <!-- Only the weights the stylesheet uses: Fraunces 600 roman + italic,
       Jakarta 500/600/700, Plex Mono 500/600. Loaded without blocking
       first paint: the sheet is fetched at high priority but applied
       only when it arrives (print → all), so React boots immediately. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Plus+Jakarta+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Plus+Jakarta+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Plus+Jakarta+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" /></noscript>
  <!-- The logo is the topbar's brand mask and the 3D hero's source. -->
  <link rel="preload" href="/logo-mark.png" as="image" />
  <link rel="preload" href="/logo.png" as="image" />
</head>

    </div>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
